apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.fullname }}-config
  namespace: {{ .Values.namespace }}
data:
  ENV: {{ .Values.config.ENV }}
  LOG_LEVEL: {{ .Values.config.LOG_LEVEL }}
  PORT: {{ .Values.config.PORT | quote }}
  AWS_REGION: {{ .Values.config.AWS_REGION }}
  SQS_QUEUE_URL: {{ .Values.config.SQS_QUEUE_URL | quote }}
  SNS_TOPIC_ARN: {{ .Values.config.SNS_TOPIC_ARN | quote }}
  SOLVER_TIME_LIMIT_SECONDS: {{ .Values.config.SOLVER_TIME_LIMIT_SECONDS | quote }}
  MAX_CONCURRENT_SOLVES: {{ .Values.config.MAX_CONCURRENT_SOLVES | quote }}
  SQS_WAIT_SECONDS: {{ .Values.config.SQS_WAIT_SECONDS | quote }}
